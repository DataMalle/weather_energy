resources:
  schemas:
    pipeline:
      catalog_name: ${var.catalog}
      name: elvader_pipeline
      comment: Landing-volym, bronze och silver för elpris och väder
    gold:
      catalog_name: ${var.catalog}
      name: elvader_gold
      comment: Gold-tabeller, kvalitetsresultat och körlogg som appen läser

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.pipeline.name}
      name: landing
      volume_type: MANAGED
      comment: Landningszon där GitHub Actions lägger elprisfiler

  jobs:
    elvader_etl:
      name: elvader-etl
      description: Väder (pull) + elpris (landing) -> silver -> kvalitetskontroll -> gold
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 20 */3 * * ?"
        timezone_id: Europe/Stockholm
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: weather_past_days
          default: "2"
      tasks:
        - task_key: ingest_weather
          notebook_task:
            notebook_path: ../src/pipeline/01_ingest_weather.py
        - task_key: ingest_prices
          notebook_task:
            notebook_path: ../src/pipeline/02_ingest_prices.py
        - task_key: silver
          depends_on:
            - task_key: ingest_weather
            - task_key: ingest_prices
          notebook_task:
            notebook_path: ../src/pipeline/03_silver.py
        - task_key: quality_checks
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/pipeline/04_quality_checks.py
        - task_key: gold
          depends_on:
            - task_key: quality_checks
          notebook_task:
            notebook_path: ../src/pipeline/05_gold.py
